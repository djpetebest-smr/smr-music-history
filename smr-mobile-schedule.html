<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SMR Mobile Schedule</title>
<style>
:root{
  --gold:#e1d700;
  --gold-soft:#f3e95f;
  --bg:#090909;
  --card:#181818;
  --card2:#222;
  --line:#353535;
  --muted:#aaa;
  --green:#20d46b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}
body{width:100%;min-height:100vh}
.app{width:100%;max-width:520px;margin:0 auto;padding:10px}
.header{
  display:flex;align-items:center;gap:11px;
  background:linear-gradient(135deg,#0d0d0d,#1b1b1b);
  border:1.5px solid var(--gold);border-radius:12px;padding:10px;margin-bottom:10px
}
.logo{width:58px;height:58px;object-fit:contain;border-radius:50%;flex:0 0 auto}
.brand{min-width:0}
.brand h1{font-size:20px;line-height:1.1;margin:0;color:var(--gold)}
.brand p{font-size:11px;line-height:1.25;margin:4px 0 0;color:#ccc}
.live{
  margin-left:auto;min-width:112px;max-width:145px;
  background:#111;border:1px solid #444;border-radius:9px;padding:7px
}
.live-label{font-size:8px;color:#999;font-weight:bold;letter-spacing:.7px}
.live-title{font-size:11px;font-weight:bold;line-height:1.2;margin-top:2px}
.live-title .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px}
.live-dj{font-size:9px;color:var(--gold-soft);margin-top:2px;line-height:1.2}
.nav{
  display:flex;align-items:center;gap:5px;margin-bottom:9px
}
button{
  min-height:36px;border:1px solid var(--gold);border-radius:7px;
  background:#151515;color:#fff;padding:7px 9px;font-size:11px;font-weight:bold
}
button:active,button:focus{background:var(--gold);color:#000}
.week{flex:1;text-align:center;color:var(--gold);font-size:12px;font-weight:bold;line-height:1.2}
.updated{text-align:center;color:#888;font-size:9px;margin:-3px 0 9px}
.day{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  margin-bottom:9px;overflow:hidden
}
.day-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;background:#121212;border-bottom:1px solid var(--line)
}
.day-name{font-size:14px;font-weight:bold}
.day-date{font-size:12px;color:var(--gold);font-weight:bold}
.day.today{border-color:var(--gold)}
.day.today .day-head{background:#2b2900}
.show{
  display:grid;grid-template-columns:78px 1fr;gap:8px;
  padding:9px 10px;border-bottom:1px solid #303030
}
.show:last-child{border-bottom:0}
.time{font-size:11px;color:var(--gold);font-weight:bold;white-space:nowrap;padding-top:1px}
.info{min-width:0}
.name{font-size:12px;font-weight:bold;line-height:1.2}
.dj{font-size:10px;color:#ccc;line-height:1.25;margin-top:3px}
.badge{
  display:inline-block;font-size:8px;padding:2px 5px;border-radius:8px;
  background:#2b2b2b;color:#aaa;margin-top:4px
}
.empty{padding:12px 10px;color:#777;font-size:11px}
.footer{
  text-align:center;color:#777;font-size:9px;padding:5px 0 12px
}
.error{
  padding:20px 12px;text-align:center;background:#321414;
  border:1px solid #933;border-radius:10px;color:#fff;font-size:12px
}
@media(max-width:360px){
  .app{padding:7px}
  .logo{width:50px;height:50px}
  .brand h1{font-size:17px}
  .live{min-width:96px;padding:6px}
  .show{grid-template-columns:70px 1fr;padding:8px}
  .time{font-size:10px}.name{font-size:11px}.dj{font-size:9px}
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <img class="logo" src="https://raw.githubusercontent.com/djpetebest-smr/smr-music-history/refs/heads/main/smr-logo.png" alt="Social Music Radio">
    <div class="brand">
      <h1>Social Music Radio</h1>
      <p>Where The Music Comes First</p>
    </div>
    <div class="live" aria-live="polite">
      <div class="live-label">ON AIR NOW</div>
      <div id="liveTitle" class="live-title"><span class="dot"></span>Checking…</div>
      <div id="liveDj" class="live-dj"></div>
    </div>
  </header>

  <nav class="nav" aria-label="Week navigation">
    <button id="prev" type="button">‹ Prev</button>
    <div id="week" class="week"></div>
    <button id="today" type="button">Today</button>
    <button id="next" type="button">Next ›</button>
  </nav>
  <div id="updated" class="updated">Loading schedule…</div>

  <section id="schedule" aria-live="polite"></section>

  <div class="footer">SMR schedule updates automatically from the live schedule.</div>
</main>

<script>
const URL="https://raw.githubusercontent.com/djpetebest-smr/smr-music-history/refs/heads/main/smr-show-schedule.json";
const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const keys=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
let data=null;
let start=weekStart(new Date());

function weekStart(d){
  const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x
}
function add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function pad(n){return String(n).padStart(2,"0")}
function key(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function mins(t){
  if(!t)return null;
  const m=/^(\d{1,2}):(\d{2})$/.exec(t);
  return m?Number(m[1])*60+Number(m[2]):null
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function occurs(s,d){
  const n=d.getDay();
  if(s.type==="daily")return true;
  if(s.type==="weekday")return n>=1&&n<=5;
  if(s.type==="weekly")return s.day===keys[n];
  if(s.type==="once")return s.date===key(d);
  return false
}
function dj(s,d){
  return s.djByDay ? (s.djByDay[String(d.getDay())]||s.dj||"") : (s.dj||"")
}
function typeName(t){return t==="once"?"One-off":t==="daily"?"Daily":t==="weekday"?"Weekdays":"Weekly"}
function render(){
  if(!data)return;
  const end=add(start,6);
  document.getElementById("week").textContent=
    `${start.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${end.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;
  const area=document.getElementById("schedule");area.innerHTML="";
  for(let i=0;i<7;i++){
    const d=add(start,i), day=document.createElement("section");
    day.className="day"+(key(d)===key(new Date())?" today":"");
    const shows=data.shows.filter(s=>occurs(s,d)).sort((a,b)=>(mins(a.start)||0)-(mins(b.start)||0));
    day.innerHTML=`<div class="day-head"><span class="day-name">${days[d.getDay()]}</span><span class="day-date">${d.getDate()} ${d.toLocaleDateString("en-GB",{month:"short"})}</span></div>`;
    if(!shows.length){
      day.insertAdjacentHTML("beforeend",'<div class="empty">No scheduled shows</div>');
    }else{
      shows.forEach(s=>{
        const djName=dj(s,d);
        const row=document.createElement("div");row.className="show";
        row.innerHTML=
          `<div class="time">${esc(s.start||"")} – ${esc(s.end||"")}</div>`+
          `<div class="info"><div class="name">${esc(s.name)}</div>`+
          (djName?`<div class="dj">🎙️ ${esc(djName)}</div>`:"")+
          `<span class="badge">${esc(typeName(s.type))}</span></div>`;
        day.appendChild(row);
      });
    }
    area.appendChild(day);
  }
}
function londonParts(){
  const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit",weekday:"long",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const o={};p.forEach(x=>{if(x.type!=="literal")o[x.type]=x.value});return o
}
function updateLive(){
  if(!data)return;
  const u=londonParts(), dow=keys.indexOf(u.weekday.toLowerCase()), now=Number(u.hour)*60+Number(u.minute);
  const d=new Date(Number(u.year),Number(u.month)-1,Number(u.day),12);
  let live=null;
  data.shows.forEach(s=>{
    if(!occurs(s,d))return;
    const a=mins(s.start),b=mins(s.end);if(a===null||b===null)return;
    const active=b>a ? now>=a&&now<b : now>=a||now<b;
    if(active)live=s;
  });
  if(live){
    document.getElementById("liveTitle").innerHTML=`<span class="dot"></span>${esc(live.name)}`;
    const presenter=dj(live,d);
    document.getElementById("liveDj").textContent=presenter?`with ${presenter}`:"";
  }else{
    document.getElementById("liveTitle").innerHTML=`<span class="dot" style="background:#777"></span>No scheduled show`;
    document.getElementById("liveDj").textContent="Social Music Radio";
  }
}
async function load(){
  try{
    const r=await fetch(URL+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const json=await r.json();
    if(!json||!Array.isArray(json.shows))throw new Error("Invalid schedule");
    data=json;render();updateLive();
    document.getElementById("updated").textContent=
      `Updated ${new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})} • ${json.shows.length} schedule entries`;
  }catch(e){
    document.getElementById("schedule").innerHTML='<div class="error">SMR schedule temporarily unavailable.</div>';
    document.getElementById("updated").textContent="Unable to load schedule";
    console.error(e);
  }
}
document.getElementById("prev").addEventListener("click",()=>{start=add(start,-7);render()});
document.getElementById("next").addEventListener("click",()=>{start=add(start,7);render()});
document.getElementById("today").addEventListener("click",()=>{start=weekStart(new Date());render()});
load();
setInterval(load,60000);
setInterval(updateLive,15000);
</script>
</body>
</html>
