<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<meta property="og:title" content="Social Music Radio — Listen Live">
<meta property="og:description" content="Listen live to Social Music Radio">
<title>Social Music Radio — Listen Live</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 50% -10%,#3a3a3a 0,#151515 38%,#050505 78%);padding:18px 12px 28px}
.app{width:100%;max-width:560px;margin:auto;background:linear-gradient(145deg,#1a1a1a,#080808);border:1px solid #444;border-radius:26px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.72)}
.header{text-align:center;padding:22px 18px 12px}.logo{width:min(54vw,230px);aspect-ratio:1;object-fit:contain;display:block;margin:auto;border-radius:50%}
.brand{font-size:24px;font-weight:900;letter-spacing:2.5px;margin-top:8px}.sub{font-size:11px;color:#aaa;letter-spacing:2px;margin-top:5px;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:7px 13px;border:1px solid #555;border-radius:999px;background:#111;font-size:11px;font-weight:800;letter-spacing:1.4px}
.dot{width:9px;height:9px;border-radius:50%;background:#e21b23;box-shadow:0 0 13px rgba(226,27,35,.9)}
.card{margin:10px 16px 0;padding:20px 16px;text-align:center;border:1px solid #333;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025))}
.kicker{font-size:10px;color:#999;letter-spacing:2px;text-transform:uppercase}.show{font-size:25px;font-weight:900;margin-top:7px}.dj{font-size:15px;color:#d0d0d0;margin-top:5px}.time{font-size:12px;color:#888;margin-top:7px}
.fastcast{margin:18px auto 0;max-width:500px;border-top:1px solid #303030;padding-top:16px;min-height:160px}.fastcast-title{font-size:10px;color:#999;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
#sc-player{width:100%;min-height:100px}#sc-player [is="player"]{max-width:100%!important}
.ticker{margin-top:16px;overflow:hidden;white-space:nowrap;border-top:1px solid #2b2b2b;border-bottom:1px solid #2b2b2b;background:#090909}
.track{display:inline-block;padding:12px 0;padding-left:100%;animation:scroll 30s linear infinite;font-size:12px;color:#ddd}.track:hover{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.actions{display:flex;gap:10px;padding:18px 18px 10px}.action{flex:1;text-align:center;text-decoration:none;color:#fff;padding:12px 8px;border:1px solid #383838;border-radius:12px;background:#141414;font-size:11px;font-weight:800;letter-spacing:.4px}.action:hover{background:#222}
.footer{text-align:center;padding:10px 18px 21px;color:#666;font-size:10px;line-height:1.5}
@media(max-width:390px){.brand{font-size:20px}.show{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<img class="logo" src="smr-logo.png" alt="Social Music Radio logo">
<div class="brand">SOCIAL MUSIC RADIO</div>
<div class="sub">Your music • Your memories</div>
<div class="live"><span class="dot"></span> LIVE NOW</div>
</header>

<section class="card">
<div class="kicker">On Air Now</div>

<div class="dj" id="djName"></div>
<div class="time" id="showTime"></div>

<div class="fastcast">
<div class="fastcast-title">Now Playing</div>

<div id="sc-player">
<div
is="player"
lang="en"
api-url="https://eu11.fastcast4u.com:1450/api/v2"
server-id="1"
station-name="Social Music Radio"
station-url="https://www.socialmusicradio.uk"
imagecontainer="left"
imagecontainer-bg="#000000"
imagecontainer-bg-opacity="1"
controlscontainer="right"

controlscontainer-bg-opacity="1"
controlscontainer-bg-img="https://eu11.fastcast4u.com:1450/media/widgets/10605.jpg"
historycontainer="right"
historycontainer-bg="#cdd8e5"
historycontainer-bg-opacity="1"
:show-history="true"
history-limit="1"
sharecontainer="both"
sharecontainer-bg="#ffffff"
sharecontainer-bg-opacity="1"
:show-share="false"
share-url=""
:share="['facebook','telegram','twitter']"
:show-dj="true"
default-dj-img="https://eu11.fastcast4u.com:1450/media/widgets/ChatGPT_Image_Jun_15_2026_04_05_36_PM_d73LSZO.png"
:show-image="true"
default-cover-image=""

visualizer-outline-color="#37679a"

channels-switch-color-active="#000000"
:show-vote="false"

</div>
</div>
</div>
</section>

<div class="ticker"><div class="track">🎵 SOCIAL MUSIC RADIO &nbsp; • &nbsp; LISTEN LIVE &nbsp; • &nbsp; 50s • 60s • 70s • 80s • 90s • and beyond &nbsp; • &nbsp; 🎵</div></div>

<nav class="actions">
<a class="action" href="https://www.socialmusicradio.uk/" target="_blank" rel="noopener">SMR WEBSITE</a>
<a class="action" href="https://www.facebook.com/" target="_blank" rel="noopener">SMR FACEBOOK</a>
</nav>
<div class="footer">Social Music Radio • Live from the UK</div>
</div>

<script src="https://eu11.fastcast4u.com:1450/media/static/js/sc_player/sc_player.js"></script>

<script>
const SCHEDULE_URL="https://raw.githubusercontent.com/djpetebest-smr/smr-music-history/refs/heads/main/smr-show-schedule.json";
const showName=document.getElementById("showName");
const djName=document.getElementById("djName");
const showTime=document.getElementById("showTime");

function nowParts(){
 const d=new Date();
 const days=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
 return {date:d.toISOString().slice(0,10),day:days[d.getDay()],minutes:d.getHours()*60+d.getMinutes()};
}
function mins(v){
 if(typeof v!=="string")return null;
 const m=v.match(/^(\d{1,2}):(\d{2})$/);
 return m?Number(m[1])*60+Number(m[2]):null;
}
function arrayFrom(data){
 if(Array.isArray(data))return data;
 for(const key of ["shows","schedule","events","data"])if(Array.isArray(data?.[key]))return data[key];
 return [];
}
function currentShow(data){
 const now=nowParts(),matches=[];
 for(const item of arrayFrom(data)){
  const start=mins(item.start),end=mins(item.end);
  if(start===null||end===null)continue;
  const type=String(item.type||"").toLowerCase(),day=String(item.day||"").toLowerCase();
  let applies=false;
  if(type==="once"&&item.date===now.date)applies=true;
  if((type==="weekly"||type==="")&&day===now.day)applies=true;
  if(!applies)continue;
  const inside=end>start?now.minutes>=start&&now.minutes<end:now.minutes>=start||now.minutes<end;
  if(inside)matches.push(item);
 }
 return matches.length?matches[matches.length-1]:null;
}
async function updateSchedule(){
 try{
  const response=await fetch(SCHEDULE_URL+"?v="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw new Error("Schedule unavailable");
  const data=await response.json(),current=currentShow(data);
  if(current){
   showName.textContent=current.name||"Social Music Radio";
   djName.textContent=current.dj?"with "+current.dj:"";
   showTime.textContent=current.start&&current.end?current.start+" – "+current.end:"";
  }else{
   showName.textContent="Social Music Radio";djName.textContent="Live music";showTime.textContent="";
  }
 }catch(error){
  showName.textContent="Social Music Radio";djName.textContent="Live radio";showTime.textContent="";
 }
}
updateSchedule();
setInterval(updateSchedule,60000);
</script>
</body>
</html>
